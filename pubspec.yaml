name: flutter_filament
description: Filament 5-inspired admin panel framework for Flutter. Schema-driven forms, tables, resources with auto-generated CRUD pages.
version: 0.2.3
homepage: https://github.com/lamkhil/flutter_filament
repository: https://github.com/lamkhil/flutter_filament
issue_tracker: https://github.com/lamkhil/flutter_filament/issues
topics:
  - admin
  - panel
  - crud
  - filament
  - scaffold

environment:
  sdk: ^3.11.4
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  intl: ^0.20.2
  equatable: ^2.0.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
