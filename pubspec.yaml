name: flutter_filament
description: A Filament-inspired admin panel framework for Flutter. Provides Panel, Resource, Form, Table, Widget primitives with schema-driven UI.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  intl: ^0.20.2
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
